networks:
  internal_net:
    driver: bridge

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: ${LOG_MAX_SIZE:-100m}
    max-file: ${LOG_MAX_FILE:-5}

services:
  gateway:
    image: caddy:2-alpine
    container_name: lovedones-gateway
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/tiles:/srv/tiles:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal_net
    depends_on:
      auth-admin-service:
        condition: service_healthy
      realtime-service:
        condition: service_healthy
      web-dashboard:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lovedones-cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    logging: *default-logging
    command: tunnel --no-autoupdate run --url http://gateway:80
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - internal_net
    depends_on:
      - gateway

  postgres:
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.4-alpine}
    # Use POSTGIS_IMAGE=imresamu/postgis:16-3.4-alpine on native arm64 hosts
    container_name: lovedones-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lovedones}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lovedones}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lovedones-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-admin-service:
    build:
      context: .
      dockerfile: apps/auth-admin-service/Dockerfile
    container_name: lovedones-auth-admin
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-lovedones}}
      DATABASE_SSL: ${DATABASE_SSL:-}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-minimum-32-characters-long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-jwt-refresh-secret-key-min-32-chars}
      LOG_DIR: /var/log/app
      MAX_LOG_STORAGE_MB: ${MAX_LOG_STORAGE_MB:-500}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
      LOG_RETENTION_FILES: ${LOG_RETENTION_FILES:-10}
      LOG_RING_MAX_ENTRIES: ${LOG_RING_MAX_ENTRIES:-500}
      LOCATION_RETENTION_DAYS: ${LOCATION_RETENTION_DAYS:-0}
      TILES_DIR: /srv/tiles
      ALLOW_MEMBER_MAP_DOWNLOADS: ${ALLOW_MEMBER_MAP_DOWNLOADS:-true}
      MAX_MAP_EXTRACT_MB: ${MAX_MAP_EXTRACT_MB:-1024}
      PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL:-http://localhost:${GATEWAY_PORT:-8080}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      TRUST_CLOUDFLARE_HEADERS: ${TRUST_CLOUDFLARE_HEADERS:-false}
      SYSTEM_UPDATER_URL: ${SYSTEM_UPDATER_URL:-http://system-updater:4010}
      ALLOW_REMOTE_SYSTEM_UPDATE: ${ALLOW_REMOTE_SYSTEM_UPDATE:-true}
      LATEST_MOBILE_VERSION: ${LATEST_MOBILE_VERSION:-}
      MIN_SUPPORTED_APP_VERSION: ${MIN_SUPPORTED_APP_VERSION:-0.1.0}
      MOBILE_DOWNLOAD_URL: ${MOBILE_DOWNLOAD_URL:-}
      MOBILE_RELEASE_NOTES: ${MOBILE_RELEASE_NOTES:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./logs:/var/log/app
      - ./infra/tiles:/srv/tiles
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4001/health | grep -q '\"status\"'"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime-service:
    build:
      context: .
      dockerfile: apps/realtime-service/Dockerfile
    container_name: lovedones-realtime
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-lovedones}}
      DATABASE_SSL: ${DATABASE_SSL:-}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-minimum-32-characters-long}
      PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL:-http://localhost:${GATEWAY_PORT:-8080}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      TRUST_CLOUDFLARE_HEADERS: ${TRUST_CLOUDFLARE_HEADERS:-false}
      LOG_DIR: /var/log/app
      LOG_RETENTION_FILES: ${LOG_RETENTION_FILES:-10}
      LOG_RING_MAX_ENTRIES: ${LOG_RING_MAX_ENTRIES:-500}
    volumes:
      - ./logs:/var/log/app
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4002/health | grep -q '\"status\"'"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  map-service:
    build:
      context: .
      dockerfile: apps/map-service/Dockerfile
    container_name: lovedones-map-service
    profiles: ["standalone-maps"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 8080
      TILES_DIR: /srv/tiles
      LOG_DIR: /var/log/app
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}}
    volumes:
      - ./infra/tiles:/srv/tiles:ro
      - ./logs:/var/log/app
    networks:
      - internal_net

  web-dashboard:
    build:
      context: .
      dockerfile: apps/web-dashboard/Dockerfile
    container_name: lovedones-web-dashboard
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-}
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      auth-admin-service:
        condition: service_healthy
      realtime-service:
        condition: service_healthy

  system-updater:
    build:
      context: .
      dockerfile: infra/docker/updater/Dockerfile
    container_name: lovedones-system-updater
    restart: unless-stopped
    logging: *default-logging
    environment:
      PORT: 4010
      REPO_DIR: /repo
      STATE_FILE: /var/log/app/system-update.json
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-minimum-32-characters-long}
      ALLOW_REMOTE_SYSTEM_UPDATE: ${ALLOW_REMOTE_SYSTEM_UPDATE:-true}
    volumes:
      - .:/repo
      - ./logs:/var/log/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4010/health | grep -q '\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
