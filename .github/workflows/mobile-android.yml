name: Mobile Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace dependency
        run: pnpm --filter @loved-ones/shared build

      - name: Generate native Android project via Expo Prebuild
        working-directory: apps/mobile-app
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK with Gradle
        working-directory: apps/mobile-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Stage APK artifact
        id: stage
        run: |
          SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "artifact_name=lovedones-android-apk-${SAFE_REF}" >> "$GITHUB_OUTPUT"
          mkdir -p dist-apk
          cp apps/mobile-app/android/app/build/outputs/apk/release/app-release.apk "dist-apk/lovedones-${SAFE_REF}.apk"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: dist-apk/*.apk
          retention-days: 14

  release:
    name: Attach APK to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          pattern: lovedones-android-apk-*
          path: dist-apk
          merge-multiple: true

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
